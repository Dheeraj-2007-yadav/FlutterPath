<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlutterPath - Learn Flutter from Scratch</title>

  <!-- 1. Apply dark class FIRST to prevent flash of unstyled content -->
  <script>
    (function () {
      if (localStorage.getItem('fp_theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <!-- 2. Load Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 3. Configure Tailwind AFTER CDN — darkMode:'class' MUST be set here -->
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>

  <!-- 4. Custom animations & transitions -->
  <style>
    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pageOut {
      from {
        opacity: 1;
        transform: translateY(0);
      }

      to {
        opacity: 0;
        transform: translateY(-10px);
      }
    }

    .page-enter {
      animation: pageIn 0.32s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .page-exit {
      animation: pageOut 0.18s ease-in both;
      pointer-events: none;
    }

    .dashboard-grid {
      align-items: flex-start !important;
    }

    .dashboard-card {
      align-self: flex-start !important;
    }

    .dashboard-card h2,
    .dashboard-card p,
    .dashboard-card span {
      color: inherit;
    }

    .bookmark-scroll {
      max-height: 360px;
      overflow-y: auto;
      min-height: 0;
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, 0.8) transparent;
    }

    .bookmark-scroll::-webkit-scrollbar {
      width: 8px;
    }

    .bookmark-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.7);
      border-radius: 9999px;
    }

    .bookmark-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .search-panel,
    .mobile-menu-panel,
    .course-content {
      transition: opacity 0.25s ease, transform 0.25s ease, max-height 0.35s ease, visibility 0.25s ease, padding 0.25s ease;
    }

    .search-panel {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-8px) scale(0.98);
    }

    .search-panel.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .mobile-menu-panel {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      max-height: 0;
      overflow: hidden;
      transform: translateY(-8px);
    }

    .mobile-menu-panel.mobile-menu-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      max-height: 420px;
      transform: translateY(0);
    }

    .course-content {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
      overflow: hidden;
    }

    .course-content.is-open {
      grid-template-rows: 1fr;
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .course-content > .course-inner {
      min-height: 0;
      overflow: hidden;
    }

    .course-toggle-icon {
      transition: transform 0.25s ease, color 0.2s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(22px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .stagger>* {
      opacity: 0;
      animation: fadeUp 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .stagger>*:nth-child(1) {
      animation-delay: 0.04s;
    }

    .stagger>*:nth-child(2) {
      animation-delay: 0.09s;
    }

    .stagger>*:nth-child(3) {
      animation-delay: 0.14s;
    }

    .stagger>*:nth-child(4) {
      animation-delay: 0.19s;
    }

    .stagger>*:nth-child(5) {
      animation-delay: 0.24s;
    }

    .stagger>*:nth-child(6) {
      animation-delay: 0.29s;
    }

    .stagger>*:nth-child(7) {
      animation-delay: 0.34s;
    }

    .stagger>*:nth-child(8) {
      animation-delay: 0.39s;
    }

    .stagger>*:nth-child(9) {
      animation-delay: 0.44s;
    }

    .stagger>*:nth-child(10) {
      animation-delay: 0.49s;
    }

    /* Typewriter blinking cursor */
    #typewriter {
      border-right: 3px solid #2563eb;
      animation: blink 0.65s step-end infinite;
    }

    @keyframes blink {

      from,
      to {
        border-color: transparent;
      }

      50% {
        border-color: #2563eb;
      }
    }

    /* Smooth theme transition on all elements */
    *,
    *::before,
    *::after {
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.15s ease;
    }

    .prose p,
    .prose li,
    .prose strong,
    .prose b {
      color: inherit;
    }

    .dark .prose h2,
    .dark .prose h3,
    .dark .prose p,
    .dark .prose li,
    .dark .prose strong,
    .dark .prose b,
    .dark .prose code {
      color: #e5e7eb !important;
    }

    .dark .prose code {
      background-color: rgba(59, 130, 246, 0.15);
    }

    @keyframes bookmarkSpark {
      0% {
        transform: scale(1) rotate(0deg);
        filter: drop-shadow(0 0 0 rgba(250, 204, 21, 0));
      }

      20% {
        transform: scale(1.18) rotate(-8deg);
        filter: drop-shadow(0 0 10px rgba(250, 204, 21, 0.9));
      }

      40% {
        transform: scale(1.08) rotate(8deg);
      }

      60% {
        transform: scale(1.22) rotate(-4deg);
        filter: drop-shadow(0 0 12px rgba(250, 204, 21, 1));
      }

      100% {
        transform: scale(1) rotate(0deg);
        filter: drop-shadow(0 0 0 rgba(250, 204, 21, 0));
      }
    }

    .bookmark-spark {
      animation: bookmarkSpark 0.5s ease-out;
    }

    .bookmark-spark::after {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 9999px;
      border: 2px solid rgba(250, 204, 21, 0.9);
      opacity: 0;
      animation: bookmarkSparkRing 0.5s ease-out;
    }

    @keyframes bookmarkSparkRing {
      0% {
        opacity: 1;
        transform: scale(0.7);
      }

      100% {
        opacity: 0;
        transform: scale(1.4);
      }
    }

    @keyframes successPop {
      0% {
        transform: scale(0.55) rotate(-10deg);
        opacity: 0.2;
        filter: drop-shadow(0 0 0 rgba(250, 204, 21, 0));
      }

      25% {
        transform: scale(1.65) rotate(8deg);
        opacity: 1;
        filter: drop-shadow(0 0 18px rgba(250, 204, 21, 0.9));
      }

      55% {
        transform: scale(1.15) rotate(-4deg);
        filter: drop-shadow(0 0 24px rgba(253, 224, 71, 0.9));
      }

      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
        filter: drop-shadow(0 0 0 rgba(250, 204, 21, 0));
      }
    }

    @keyframes celebBurst {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.4);
      }

      20% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translateY(-18px) scale(1.2);
      }
    }

    .quiz-success-emoji-wrap {
      position: relative;
      display: inline-block;
      margin-right: 0.2rem;
      vertical-align: middle;
    }

    .quiz-success-emoji {
      position: relative;
      display: inline-block;
      animation: successPop 0.7s cubic-bezier(0.2, 0.9, 0.2, 1.2);
      transform-origin: center;
      font-size: 1.25em;
      line-height: 1;
    }

    .quiz-success-emoji-wrap::before,
    .quiz-success-emoji-wrap::after,
    .quiz-success-emoji-wrap span::before,
    .quiz-success-emoji-wrap span::after {
      content: "✨";
      position: absolute;
      font-size: 0.7rem;
      opacity: 0;
      animation: celebBurst 0.9s ease-out forwards;
    }

    .quiz-success-emoji-wrap::before {
      left: -10px;
      top: -8px;
      animation-delay: 0.05s;
    }

    .quiz-success-emoji-wrap::after {
      right: -8px;
      top: -12px;
      animation-delay: 0.12s;
    }

    .quiz-success-emoji-wrap span::before {
      left: 8px;
      top: -18px;
      animation-delay: 0.2s;
    }

    .quiz-success-emoji-wrap span::after {
      right: -2px;
      bottom: -12px;
      animation-delay: 0.28s;
    }

    /* Don't override animation keyframes with transition */
    .page-enter,
    .page-exit,
    .stagger>* {
      transition: none !important;
    }

    body {
      font-family: Inter, "Segoe UI", sans-serif;
      letter-spacing: -0.01em;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      letter-spacing: -0.04em;
      line-height: 1.08;
      color: #0f172a;
    }

    .dark h1,
    .dark h2,
    .dark h3,
    .dark h4,
    .dark h5,
    .dark h6 {
      color: #f8fafc;
    }

    .section-kicker {
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 800;
      color: #2563eb;
    }

    .readable-copy {
      color: #334155;
      line-height: 1.8;
      font-size: 1.06rem;
    }

    .dark .readable-copy {
      color: #dfe7f4;
    }

    .soft-panel {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 250, 252, 0.94));
      box-shadow: 0 22px 48px rgba(15, 23, 42, 0.08);
    }

    .dark .soft-panel {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.96));
      box-shadow: 0 24px 52px rgba(2, 6, 23, 0.6);
    }

    .headline-glow {
      text-shadow: 0 8px 28px rgba(37, 99, 235, 0.14);
    }

    .feature-card-title {
      color: #0f172a;
      font-weight: 800;
    }

    .dark .feature-card-title {
      color: #f8fafc;
    }
  </style>
</head>

<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased">

  <nav id="navbar" class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 sticky top-0 z-50">
    <!-- Navbar populated by app.js -->
  </nav>

  <main id="app" class="min-h-screen bg-gray-50 dark:bg-gray-950">
    <!-- Content populated by app.js -->
  </main>

  <footer class="bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 py-8">
    <div class="max-w-7xl mx-auto px-4 text-center text-gray-500 dark:text-gray-400 text-sm">
      &copy; 2026 FlutterPath. All rights reserved.
    </div>
  </footer>

  <!-- App Scripts -->
  <script src="data/flutter_lessons_full.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
